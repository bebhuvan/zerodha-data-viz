<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F6F1E9"></rect><g class="frame-head"><text font-family="&quot;Libre Franklin&quot;" font-size="22" font-weight="700" letter-spacing="0.08em" fill="#C2492F"><tspan x="72" y="89.6">INFLATION BY STATE</tspan></text><text font-family="&quot;Source Serif 4&quot;" font-size="54" font-weight="600" fill="#1E1B16"><tspan x="72" y="156.7">Prices in Kerala are rising seven</tspan><tspan x="72" y="217.18">times as fast as in India overall</tspan></text><text font-family="&quot;Libre Franklin&quot;" font-size="27" font-weight="400" fill="#4A453D"><tspan x="72" y="272.06">Year-on-year change in the consumer price index, December 2025.</tspan><tspan x="72" y="309.32">Kerala's 9.49% compares with 1.33% for India. Manipur, at −4.23%, saw</tspan><tspan x="72" y="346.58">prices fall.</tspan></text></g><g class="frame-foot"><text x="1008" y="1294" text-anchor="end" font-family="&quot;Libre Franklin&quot;" font-size="21" font-weight="700" fill="#1E1B16">Markets by Zerodha</text><text font-family="&quot;Libre Franklin&quot;" font-size="20" font-weight="400" fill="#6F685D"><tspan x="72" y="1294">Source: MOSPI (CPI, base 2012, combined rural and urban)</tspan></text><line x1="72" x2="1008" y1="1258" y2="1258" stroke="#DDD5C7" stroke-width="1.5"></line><text font-family="&quot;Libre Franklin&quot;" font-size="20" font-weight="400" fill="#6F685D"><tspan x="72" y="1183">Grey: no comparable figure. Ladakh: no separate CPI series; Arunachal Pradesh: no combined index</tspan><tspan x="72" y="1210">published; Dadra and Nagar Haveli and Daman and Diu: CPI still reports the two former UTs</tspan><tspan x="72" y="1237">separately.</tspan></text></g><defs><pattern id="nodata" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E4DED3"></rect><line x1="0" x2="0" y1="0" y2="8" stroke="#6F685D" stroke-width="2"><